# Alembic configuration.
#
# NOTE: keep this file ASCII-ONLY. Alembic reads it via configparser with
# encoding="locale", which is GBK on Windows -- any UTF-8 comment here makes
# every alembic command die with UnicodeDecodeError. Chinese notes about this
# migration setup live in alembic/env.py instead (Python source reads as UTF-8).
#
# NOTE: sqlalchemy.url is intentionally NOT set here. alembic/env.py reads the
# connection string from backend.core.settings, so there is exactly one source
# of truth for DB config. Setting it here as well would let .env and the ini
# drift apart -- the worst kind of bug to chase.

[alembic]
script_location = alembic
prepend_sys_path = .
# Produces 0001_create_org_tables.py
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
