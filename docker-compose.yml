# RAG 知识库管理平台 —— 单机全量编排（阿里云 ECS）
#
# 启动：docker compose up -d
# 首次启动 Milvus 需要 60-90 秒完成初始化，用 docker compose ps 观察 healthy。
#
# 启动顺序：mysql healthy → **migrate**（一次性，跑 `alembic upgrade head`）
#   → migrate 成功退出后 api / worker / beat 才启动 → api healthy → nginx。
# 看到 `rag-migrate` 的状态是 **Exited (0)** 是**正常的**，它就是跑完即退。
# 迁移失败时业务服务一律不启动（这是刻意的：schema 不对时「起来了」比「没起来」更难查）。
#   排障：docker compose ps -a        # 看 migrate 的退出码
#         docker compose logs migrate # 看 alembic 的报错原文
#         curl -s localhost:8000/ready # 确认 schema 就绪（200 就绪 / 503 未就绪）
#
# ⚠️ 内存预算（PRD §11.3 R4）：Milvus ~4G + MySQL ~1G + Redis ~0.3G
#    + API/worker/beat ~1.5G + Nginx ~0.1G ≈ 7G。
#    因此 ECS 至少 4核8G。若为 2C4G，必须把 Milvus 拆到独立机器。
#
# ⚠️ 端口安全（PRD §11.3 R2）：3306 / 19530 / 6379 对外发布是为了
#    本地开发能直连。务必在阿里云安全组把这三个端口限制为
#    **你自己的公网 IP /32**，绝不能对 0.0.0.0/0 开放。

name: rag-kb

services:
  # ==================== 基础设施 ====================

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: rag-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [rag_net]

  minio:
    # ⚠️ 此版本自 Milvus v2.2.5 起固定，升级会导致 Milvus 异常
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [rag_net]

  milvus:
    image: milvusdb/milvus:v2.5.27
    container_name: rag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      # 本地开发直连用，必须由安全组限制来源 IP
      - "19530:19530"
      # 9091 是健康检查与 metrics 端口，不要对外暴露
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [rag_net]

  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 中设置}
      MYSQL_DATABASE: ${MYSQL_DB:-rag_kb}
      MYSQL_USER: ${MYSQL_USER:-rag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须在 .env 中设置}
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动执行的初始化脚本
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 本地开发直连用，必须由安全组限制来源 IP
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [rag_net]

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    # 强制密码：Redis 一旦公网可达且无密码，等于把会话与缓存全送人
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?必须在 .env 中设置}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    ports:
      # 本地开发直连用，必须由安全组限制来源 IP
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [rag_net]

  # ==================== 业务服务 ====================

  # 一次性迁移。跑完即退出，正常结果是 **Exited (0)**，不是 Up。
  #
  # 🔴 存在的理由：`alembic upgrade` 此前**没有任何调用点** —— 不在 Dockerfile 里、
  #    不在 API 的 lifespan 里、也不在 mysql 的 init 脚本里（那个脚本只设字符集）。
  #    于是库里停在 0002，而代码已经到 0007：进程能起来、`/health` 回 ok，
  #    直到用户提问才 500（`sys_audit_log` 缺失会让**每个写操作整体失败**）。
  #    这个「缺口」就是当初「启动就报错、MySQL 里缺表」的根因。
  #
  # 🔴 为什么是**独立的一次性服务**，而不是让 api / worker / beat 各自跑一遍：
  #    迁移不是幂等热路径。四个进程同时 `upgrade head` 会并发跑 DDL，
  #    而 0007 含 `add_column` + `add_index`，重复执行直接报「列已存在」；
  #    更糟的是 `--reload` 或滚动更新会把这段竞态**反复**触发。
  #    一个写者、跑完即退，是这里唯一稳的形状。
  #
  # 🔴 为什么不让 FastAPI 在 lifespan 里 `create_all()` / 自动 upgrade：
  #    schema 的写入者只能有一个（本服务）。放在 API 里，本地 `--reload` 每次
  #    改代码都会试图改库，多副本部署时更是几个进程抢着改同一个 schema。
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-migrate
    # 跑完就退，**不要**重启 —— 失败时重启只会把同一条 SQL 错误刷屏，
    # 而正确处置是「看日志、改问题、重新 up」。`restart: on-failure` 会让
    # `service_completed_successfully` 永不满足，业务服务随之永远起不来。
    restart: "no"
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    env_file: [.env]
    environment:
      # 🔴 必须覆盖：.env 里的 MYSQL_HOST 指的是**开发机的云端实例**，
      #    容器里要连的是 compose 的 mysql 服务。漏掉这一行，迁移会跑去改
      #    运行时用的那个库 —— 而那是另一套数据（且那台机器只允许动 rag_kb）。
      MYSQL_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks: [rag_net]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      # 容器内用服务名寻址，覆盖 .env 里面向本地开发的 127.0.0.1
      MYSQL_HOST: mysql
      MILVUS_HOST: milvus
      REDIS_HOST: redis
    ports:
      # 仅绑定回环，仅供 ECS 本机排障；外部流量一律走 Nginx
      - "127.0.0.1:8000:8000"
    depends_on:
      # 🔴 `service_completed_successfully` 而非 `service_started`：
      #    要的是「迁移**成功**」这个结果，不是「迁移启动了」。写成 started 的话，
      #    迁移还在跑（或已经失败退出）API 就起来了，等于没加这道闸。
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      # 用镜像自带的 Python 标准库，不装 curl（slim 镜像里没有）。
      # 打 `/ready` 而不是 `/health`：后者只证明进程活着，缺表时照样 200。
      # 503 会让 urlopen 抛 HTTPError ⇒ 非零退出码 ⇒ 判定 unhealthy。
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/ready', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      # 给 lifespan 的 schema 检查 + FAQ 装载留出时间，否则启动期会被误判为 unhealthy
      start_period: 40s
    networks: [rag_net]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-worker
    # ⚠️ Linux 容器里可以用默认 prefork 池；Windows 上**本机**跑 worker 必须 `-P solo`。
    restart: unless-stopped
    command: ["celery", "-A", "backend.tasks", "worker", "-l", "info", "--concurrency=2"]
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      MILVUS_HOST: milvus
      REDIS_HOST: redis
    depends_on:
      # worker 是**写库**的（导入流水线、缺口聚合），schema 未就绪时它不会「起不来」，
      # 只会在任务里一条条失败 —— 同样要靠 migrate 挡住。
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks: [rag_net]

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-beat
    restart: unless-stopped
    command: ["celery", "-A", "backend.tasks", "beat", "-l", "info"]
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      MILVUS_HOST: milvus
      REDIS_HOST: redis
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [rag_net]

  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端构建产物；目录不存在时 Docker 会自动创建空目录
      - ./frontend/dist:/usr/share/nginx/html/app:ro
    depends_on:
      # 等 API **就绪**再对外开端口。原来写的是列表形式（只保证启动顺序），
      # 结果是 nginx 先起来、把请求转给还在做启动检查的 API，用户看到 502。
      # 注：`depends_on` 只在**创建容器**时生效，之后重启 api 不会牵动 nginx。
      api:
        condition: service_healthy
    networks: [rag_net]

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  mysql_data:
  redis_data:

networks:
  rag_net:
    driver: bridge
