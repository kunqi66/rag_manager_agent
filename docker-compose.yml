# RAG 知识库管理平台 —— 单机全量编排（阿里云 ECS）
#
# 启动：docker compose up -d
# 首次启动 Milvus 需要 60-90 秒完成初始化，用 docker compose ps 观察 healthy。
#
# ⚠️ 内存预算（PRD §11.3 R4）：Milvus ~4G + MySQL ~1G + Redis ~0.3G
#    + API/worker/beat ~1.5G + Nginx ~0.1G ≈ 7G。
#    因此 ECS 至少 4核8G。若为 2C4G，必须把 Milvus 拆到独立机器。
#
# ⚠️ 端口安全（PRD §11.3 R2）：3306 / 19530 / 6379 对外发布是为了
#    本地开发能直连。务必在阿里云安全组把这三个端口限制为
#    **你自己的公网 IP /32**，绝不能对 0.0.0.0/0 开放。

name: rag-kb

services:
  # ==================== 基础设施 ====================

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: rag-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [rag_net]

  minio:
    # ⚠️ 此版本自 Milvus v2.2.5 起固定，升级会导致 Milvus 异常
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [rag_net]

  milvus:
    image: milvusdb/milvus:v2.5.27
    container_name: rag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      # 本地开发直连用，必须由安全组限制来源 IP
      - "19530:19530"
      # 9091 是健康检查与 metrics 端口，不要对外暴露
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [rag_net]

  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 中设置}
      MYSQL_DATABASE: ${MYSQL_DB:-rag_kb}
      MYSQL_USER: ${MYSQL_USER:-rag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须在 .env 中设置}
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动执行的初始化脚本
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 本地开发直连用，必须由安全组限制来源 IP
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [rag_net]

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    # 强制密码：Redis 一旦公网可达且无密码，等于把会话与缓存全送人
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?必须在 .env 中设置}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    ports:
      # 本地开发直连用，必须由安全组限制来源 IP
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [rag_net]

  # ==================== 业务服务 ====================

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      # 容器内用服务名寻址，覆盖 .env 里面向本地开发的 127.0.0.1
      MYSQL_HOST: mysql
      MILVUS_HOST: milvus
      REDIS_HOST: redis
    ports:
      # 仅绑定回环，仅供 ECS 本机排障；外部流量一律走 Nginx
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks: [rag_net]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-worker
    restart: unless-stopped
    command: ["celery", "-A", "backend.tasks", "worker", "-l", "info", "--concurrency=2"]
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      MILVUS_HOST: milvus
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks: [rag_net]

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-beat
    restart: unless-stopped
    command: ["celery", "-A", "backend.tasks", "beat", "-l", "info"]
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      MILVUS_HOST: milvus
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks: [rag_net]

  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端构建产物；目录不存在时 Docker 会自动创建空目录
      - ./frontend/dist:/usr/share/nginx/html/app:ro
    depends_on:
      - api
    networks: [rag_net]

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  mysql_data:
  redis_data:

networks:
  rag_net:
    driver: bridge
